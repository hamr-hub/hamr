# NOTE (2026-08): Placeholder / experimental.  Depends on the third-party
# `QoderAI/qoder-action@v0` (no `@v4` available).  Inert without
# `QODER_PERSONAL_ACCESS_TOKEN`.  See `qoder-assistant.yml` for the same
# caveat.  The repo's own CI is in `ci.yml`.
name: Qoder Auto Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  qoder-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Qoder Code Review
        uses: QoderAI/qoder-action@v0
        with:
          qoder_personal_access_token: ${{ secrets.QODER_PERSONAL_ACCESS_TOKEN }}
          prompt: |
            /review-pr
            REPO:${{ github.repository }} PR_NUMBER:${{ github.event.pull_request.number }}
            OUTPUT_LANGUAGE:Chinese