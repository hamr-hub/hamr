# templates/CI/astro.yaml
#
# HamR Astro 服务共用 CI workflow 模板。
# 来源：2026-06-30 Cluster 1 — hamr-website/docs/help 缺 CI。

name: astro

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-test:
    name: build / typecheck / lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: TypeScript
        run: npx astro check

      - name: Build
        run: npm run build

      - name: HTML validation
        run: |
          # Cluster 1 #2: hamr-docs Dockerfile 不重新聚合 OpenAPI → 这里加校验
          find dist -name '*.html' | head -50 | xargs -I {} sh -c 'echo {}; grep -E "404|Not Found" {} && exit 1 || true'

      - name: Lighthouse CI
        # Cluster 1 cross-repo: CSP/HSTS/SRI 缺失 — lighthouse 会扣分
        uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: .lighthouserc.json
          uploadArtifacts: true

      - name: Upload dist
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.event.pull_request.number }}
          path: dist/
          retention-days: 3

  build-docker:
    name: build docker image
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max