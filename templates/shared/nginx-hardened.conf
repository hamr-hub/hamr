# templates/shared/nginx-hardened.conf
#
# HamR 前端 / 反向代理 共用 nginx 配置（hardened）。
# 来源：2026-06-30 Cluster 1/2 审计发现只有 hamr-website 有完整
#       CSP/HSTS/SRI，其它前端 + hamr-app 都缺。
#
# 用法：在子项目的 nginx.conf 里 include 此文件 + 站点特定 server {} 块。
#
#   http {
#     include /etc/nginx/conf.d/hamr-hardened.conf;
#     server {
#       include /etc/nginx/conf.d/hamr-server.conf;
#       # 子项目特定 location / ...
#     }
#   }

# ---------- 通用安全头 ----------
# 防止 MIME 嗅探
add_header X-Content-Type-Options "nosniff" always;
# 防止 clickjacking
add_header X-Frame-Options "DENY" always;
# 控制 referrer
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# 限制危险浏览器能力
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
# 跨域隔离（COEP/COOP）— 视子项目需要开启
# add_header Cross-Origin-Opener-Policy "same-origin" always;
# add_header Cross-Origin-Embedder-Policy "require-corp" always;

# ---------- CSP（按子项目调） ----------
# 静态站 / Astro / Vite 默认 CSP；SRI + self + CDN 白名单
# 子项目应 override：
#   - hamr-help/docs 用了 cdn.jsdelivr.net（bootstrap / mermaid）→ 加 cdn.jsdelivr.net
#   - hamr-browser (PWA) → 加 'unsafe-inline' 给 service worker
#   - hamr-app SSR dashboard → 加 hamr-api.hamr.internal 到 connect-src
map $request_uri $csp_header {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://hamr-api.hamr.internal; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
}
add_header Content-Security-Policy $csp_header always;

# ---------- HSTS（生产） ----------
# 仅在 HTTPS 上生效；子项目若用 Cloudflare/ALB 应开启
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# ---------- 性能 ----------
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml
    font/ttf
    font/otf;

# Brotli（如果 nginx 编译时含 brotli 模块）
# brotli on;
# brotli_comp_level 5;
# brotli_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

# ---------- 缓存策略 ----------
# 静态资源长缓存 + 不可变
location ~* \.(?:css|js|woff2?|ttf|otf|eot|ico|png|jpg|jpeg|gif|svg|webp|avif)$ {
    expires 1y;
    add_header Cache-Control "public, immutable, max-age=31536000" always;
    access_log off;
}

# HTML 短缓存 / 验证
location ~* \.html$ {
    expires 5m;
    add_header Cache-Control "public, must-revalidate" always;
}

# ---------- 隐藏 nginx 版本 ----------
server_tokens off;

# ---------- 限制请求体 / 方法 ----------
client_max_body_size 10m;
limit_except GET POST HEAD OPTIONS { deny all; }

# ---------- 安全：禁用未用方法 ----------
if ($request_method !~ ^(GET|HEAD|POST|OPTIONS)$) {
    return 405;
}

# ---------- 已知改进（v0.2） ----------
# - 加 rate limiting（limit_req_zone）— 防爬 / 防爆破
# - 加 ModSecurity WAF 规则（可选）
# - 加 fail2ban 规则